<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Villain's Evil Computer</title>
	<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
	<main class="crt">
		<h1 data-text="the Supes Database :">the Supes Database :</h1>

		<div class="controls">
			<input type="text" id="search" placeholder="Search...">
			<label for="pageSize">Page size:</label>
			<select id="pageSize">
				<option value="10">10</option>
				<option value="20" selected>20</option>
				<option value="50">50</option>
				<option value="100">100</option>
				<option value="all">All</option>
			</select>
		</div>

		<table id="heroesTable">
			<thead>
				<tr>
					<th>Icon</th>
					<th data-column="name">Name <span class="sort-arrow"></span></th>
					<th data-column="fullName">Full Name <span class="sort-arrow"></span></th>
					<th>Powerstats</th>
					<th data-column="race">Race <span class="sort-arrow"></span></th>
					<th data-column="gender">Gender <span class="sort-arrow"></span></th>
					<th data-column="height">Height <span class="sort-arrow"></span></th>
					<th data-column="weight">Weight <span class="sort-arrow"></span></th>
					<th data-column="placeOfBirth">Place Of Birth <span class="sort-arrow"></span></th>
					<th data-column="alignment">Alignment <span class="sort-arrow"></span></th>
				</tr>
			</thead>
			<tbody></tbody>
		</table>

		<div id="pagination"></div>

		<div id="heroModal" class="modal crt">
			<div class="modal-content">
				<span id="closeModal" class="close">&times;</span>
				<div id="modalBody"></div>
			</div>
		</div>


	</main>

</body>
<script type="module" src="./assets/js/main.js"></script>
</html>
